name: Bounded reconstruction — nagi777

on:
  push:
    branches:
      - bounded-reconstruction-nagi777
      - empirical-pair-sensitivity-latency
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run deterministic tests
        run: pytest -q

      - name: Define six-hour UTC slice
        id: bounds
        shell: bash
        run: |
          END=$(date -u +%s)
          START=$((END - 21600))
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Slice: [$START, $END)"

      - name: Collect maker-inclusive bounded history
        run: |
          mkdir -p evidence
          python scripts/collect_historical_trades.py \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --windowed \
            --global-start ${{ steps.bounds.outputs.start }} \
            --global-end ${{ steps.bounds.outputs.end }} \
            --window-seconds 3600 \
            --min-window-seconds 300 \
            --page-size 500 \
            --raw-dir data/raw \
            --normalized-dir data/normalized \
            --duckdb-path data/bounded.duckdb \
            2>&1 | tee evidence/collection.log

      - name: Reconstruct in claim-safe incomplete mode
        run: |
          python scripts/reconstruct_trader.py \
            --target nagi777 \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --duckdb-path data/bounded.duckdb \
            --output-dir reports/incomplete-safe

      - name: Analyze fully-contained BTC 5m pair-formation cohort
        run: |
          python scripts/analyze_bounded_pair_claim.py \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --duckdb-path data/bounded.duckdb \
            --collection-start ${{ steps.bounds.outputs.start }} \
            --collection-end ${{ steps.bounds.outputs.end }} \
            --output-dir reports/bounded-claim-grade \
            | tee evidence/bounded_pair_claim.log

      - name: Analyze accounting sensitivity and pair latency
        run: |
          python scripts/analyze_pair_sensitivity.py \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --duckdb-path data/bounded.duckdb \
            --collection-start ${{ steps.bounds.outputs.start }} \
            --collection-end ${{ steps.bounds.outputs.end }} \
            --output-dir reports/pair-sensitivity \
            | tee evidence/pair_sensitivity.log

      - name: Mechanical accounting smoke test with explicit completeness assumption
        run: |
          python scripts/reconstruct_trader.py \
            --target nagi777 \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --duckdb-path data/bounded.duckdb \
            --output-dir reports/smoke-assumed-complete \
            --history-complete

      - name: Write bounded-run evidence note
        shell: bash
        run: |
          cat > evidence/BOUNDED_RUN_SCOPE.md <<EOF
          # Bounded real-data reconstruction run

          Account: \`0xbf337426aa856996b8bb79b238345dd1a0276bf7\`

          UTC epoch interval: \`${{ steps.bounds.outputs.start }}\` to \`${{ steps.bounds.outputs.end }}\` (6 hours).

          - Data collection is maker-inclusive and time-window bounded.
          - \`reports/incomplete-safe\` deliberately leaves general market-history completeness unresolved.
          - \`reports/bounded-claim-grade\` treats only observed \`btc-updown-5m-<epoch>\` markets whose complete five-minute interval lies inside the collection interval as complete.
          - \`reports/pair-sensitivity\` compares FIFO, LIFO, incremental weighted-average, latency, market-time, and transaction-hash diagnostics over the same bounded cohort.
          - Public timestamps are second-resolution, so no sub-second sequence certainty is claimed.
          - \`reports/smoke-assumed-complete\` remains mechanical-only and must not be used for claim validation.
          EOF

      - name: Summarize artifact contents
        shell: bash
        run: |
          echo "Raw files: $(find data/raw -type f | wc -l)"
          echo "Parquet files: $(find data/normalized -type f | wc -l)"
          echo "Report files: $(find reports -type f | wc -l)"
          find reports -type f -maxdepth 2 -print

      - name: Upload bounded reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: nagi777-bounded-reconstruction
          path: |
            evidence/
            data/raw/
            data/normalized/
            data/bounded.duckdb
            reports/
          if-no-files-found: error
          retention-days: 30
