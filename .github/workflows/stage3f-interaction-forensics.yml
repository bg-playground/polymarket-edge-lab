name: Milestone 3F interaction forensics

on:
  push:
    branches:
      - milestone-3f-interaction-forensics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run deterministic tests
        run: pytest -q
      - name: Define frozen discovery and external windows
        run: |
          mkdir -p evidence/stage3f data/stage3f/discovery data/stage3f/external reports/stage3f
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          def windows(month, days, label):
              result = []
              for day in days:
                  start = int(datetime(2026, month, day, 12, 0, tzinfo=timezone.utc).timestamp())
                  result.append({
                      "window_id": f"{label}-2026-{month:02d}-{day:02d}T12-18Z",
                      "start_epoch": start,
                      "end_epoch": start + 21600,
                  })
              return result

          discovery = {"windows": windows(8, range(7, 14), "discovery")}
          external = {"windows": windows(7, range(24, 31), "external")}
          with open("evidence/stage3f/discovery_manifest.json", "w", encoding="utf-8") as handle:
              json.dump(discovery, handle, indent=2)
          with open("evidence/stage3f/external_manifest.json", "w", encoding="utf-8") as handle:
              json.dump(external, handle, indent=2)
          PY
      - name: Collect independent BTC reference data
        shell: bash
        run: |
          set -euo pipefail
          for KIND in discovery external; do
            MANIFEST="evidence/stage3f/${KIND}_manifest.json"
            START=$(python -c "import json; print(json.load(open('$MANIFEST'))['windows'][0]['start_epoch'] - 300)")
            END=$(python -c "import json; print(json.load(open('$MANIFEST'))['windows'][-1]['end_epoch'])")
            python scripts/collect_btc_reference.py \
              --start "$START" --end "$END" \
              --raw "evidence/stage3f/${KIND}-coinbase-btc-usd-60s-raw.json" \
              --provenance "evidence/stage3f/${KIND}-coinbase-btc-usd-60s-provenance.json"
          done
      - name: Collect frozen Polymarket windows
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=0xbf337426aa856996b8bb79b238345dd1a0276bf7
          for KIND in discovery external; do
            MANIFEST="evidence/stage3f/${KIND}_manifest.json"
            python - "$MANIFEST" <<'PY' > /tmp/windows.tsv
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for window in data["windows"]:
              print(window["window_id"], window["start_epoch"], window["end_epoch"], sep="\t")
          PY
            while IFS=$'\t' read -r WINDOW START END; do
              echo "=== $KIND $WINDOW [$START, $END) ==="
              ROOT="data/stage3f/$KIND/$WINDOW"
              mkdir -p "$ROOT/raw" "$ROOT/normalized"
              python scripts/collect_historical_trades.py \
                --account "$ACCOUNT" \
                --windowed \
                --global-start "$START" \
                --global-end "$END" \
                --window-seconds 3600 \
                --min-window-seconds 300 \
                --page-size 500 \
                --raw-dir "$ROOT/raw" \
                --normalized-dir "$ROOT/normalized" \
                --duckdb-path "$ROOT/window.duckdb" \
                2>&1 | tee "evidence/stage3f/${WINDOW}-collection.log"
            done < /tmp/windows.tsv
          done
      - name: Materialize discovery panel
        run: |
          python scripts/materialize_stage3c_panel.py \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --manifest evidence/stage3f/discovery_manifest.json \
            --data-root data/stage3f/discovery \
            --btc-raw evidence/stage3f/discovery-coinbase-btc-usd-60s-raw.json \
            --output-dir reports/stage3f/discovery \
            | tee evidence/stage3f/discovery-materialization.log
      - name: Materialize untouched July external panel
        run: |
          python scripts/materialize_stage3c_panel.py \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --manifest evidence/stage3f/external_manifest.json \
            --data-root data/stage3f/external \
            --btc-raw evidence/stage3f/external-coinbase-btc-usd-60s-raw.json \
            --output-dir reports/stage3f/external \
            | tee evidence/stage3f/external-materialization.log
      - name: Run Stage 3F interaction forensics
        run: |
          python scripts/evaluate_stage3f_forensics.py \
            --discovery-panel reports/stage3f/discovery/stage3c_feature_panel.parquet \
            --external-panel reports/stage3f/external/stage3c_feature_panel.parquet \
            --output-dir reports/stage3f \
            | tee evidence/stage3f/interaction-forensics.log
      - name: Assert frozen Stage 3F contract
        run: |
          python - <<'PY'
          import json
          result = json.load(open("reports/stage3f/stage3f_forensics_results.json"))
          assert result["discovery_window_count"] == 7
          assert result["external_window_count"] == 7
          assert result["discovery_row_count"] > 0
          assert result["external_row_count"] > 0
          external = result["external_validation"]
          assert len(external["folds"]["hgb_all"]) == 7
          assert set(external["gate"]) == {
              "aggregate_mae_better_than_hgb_timing_inventory",
              "aggregate_brier_better_than_hgb_timing_inventory",
              "mae_day_wins_at_least_4",
              "brier_day_wins_at_least_4",
              "aggregate_mae_better_than_transparent",
              "aggregate_brier_better_than_transparent",
          }
          print("validated frozen Stage 3F evaluation contract")
          PY
      - name: Upload Stage 3F evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-3f-interaction-forensics
          path: |
            evidence/stage3f/
            reports/stage3f/
            data/stage3f/*/*/normalized/
          if-no-files-found: error
          retention-days: 30
