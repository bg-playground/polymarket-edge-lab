name: Format empirical analysis branch

on:
  push:
    branches:
      - empirical-pair-sensitivity-latency

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: empirical-pair-sensitivity-latency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Apply repository formatting
        run: |
          ruff format .
          ruff check --fix .
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format empirical sensitivity analysis"
          git push origin HEAD:empirical-pair-sensitivity-latency
