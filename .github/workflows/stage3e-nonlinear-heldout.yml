name: Milestone 3E nonlinear held-out benchmark

on:
  push:
    branches:
      - milestone-3e-nonlinear-heldout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run deterministic tests
        run: pytest -q
      - name: Define frozen seven-day panel
        run: |
          mkdir -p evidence/stage3e data/stage3e reports/stage3e
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          windows = []
          for day in range(7, 14):
              start = int(datetime(2026, 8, day, 12, 0, tzinfo=timezone.utc).timestamp())
              windows.append({
                  "window_id": f"2026-08-{day:02d}T12-18Z",
                  "start_epoch": start,
                  "end_epoch": start + 21600,
              })
          with open("evidence/stage3e/window_manifest.json", "w", encoding="utf-8") as handle:
              json.dump({"windows": windows}, handle, indent=2)
          PY
      - name: Collect independent BTC reference data
        run: |
          START=$(python -c 'import json; print(json.load(open("evidence/stage3e/window_manifest.json"))["windows"][0]["start_epoch"] - 300)')
          END=$(python -c 'import json; print(json.load(open("evidence/stage3e/window_manifest.json"))["windows"][-1]["end_epoch"])')
          python scripts/collect_btc_reference.py \
            --start "$START" --end "$END" \
            --raw evidence/stage3e/coinbase-btc-usd-60s-raw.json \
            --provenance evidence/stage3e/coinbase-btc-usd-60s-provenance.json
      - name: Collect frozen Polymarket windows
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=0xbf337426aa856996b8bb79b238345dd1a0276bf7
          python - <<'PY' > /tmp/windows.tsv
          import json
          data = json.load(open("evidence/stage3e/window_manifest.json", encoding="utf-8"))
          for window in data["windows"]:
              print(
                  window["window_id"],
                  window["start_epoch"],
                  window["end_epoch"],
                  sep="\t",
              )
          PY
          while IFS=$'\t' read -r WINDOW START END; do
            echo "=== $WINDOW [$START, $END) ==="
            mkdir -p "data/stage3e/$WINDOW/raw" "data/stage3e/$WINDOW/normalized"
            python scripts/collect_historical_trades.py \
              --account "$ACCOUNT" \
              --windowed \
              --global-start "$START" \
              --global-end "$END" \
              --window-seconds 3600 \
              --min-window-seconds 300 \
              --page-size 500 \
              --raw-dir "data/stage3e/$WINDOW/raw" \
              --normalized-dir "data/stage3e/$WINDOW/normalized" \
              --duckdb-path "data/stage3e/$WINDOW/window.duckdb" \
              2>&1 | tee "evidence/stage3e/$WINDOW-collection.log"
          done < /tmp/windows.tsv
      - name: Materialize validated causal panel
        run: |
          python scripts/materialize_stage3c_panel.py \
            --account 0xbf337426aa856996b8bb79b238345dd1a0276bf7 \
            --manifest evidence/stage3e/window_manifest.json \
            --data-root data/stage3e \
            --btc-raw evidence/stage3e/coinbase-btc-usd-60s-raw.json \
            --output-dir reports/stage3e \
            | tee evidence/stage3e/materialization.log
      - name: Evaluate constrained nonlinear models
        run: |
          python scripts/evaluate_stage3e_nonlinear.py \
            --panel reports/stage3e/stage3c_feature_panel.parquet \
            --output-dir reports/stage3e \
            | tee evidence/stage3e/nonlinear-heldout.log
      - name: Assert frozen evaluation contract
        run: |
          python - <<'PY'
          import json
          result = json.load(open("reports/stage3e/stage3e_nonlinear_results.json"))
          assert result["window_count"] == 7
          assert result["row_count"] > 0
          assert len(result["hurdle_folds"]) == 7
          for model, folds in result["nonlinear_folds"].items():
              assert len(folds) == 7, (model, len(folds))
          primary = result["summary"]["hgb_timing_inventory"]
          assert primary["mae_day_wins_vs_hurdle"] in range(8)
          assert primary["brier_day_wins_vs_hurdle"] in range(8)
          print("validated frozen Stage 3E evaluation contract")
          PY
      - name: Upload Stage 3E evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-3e-nonlinear-heldout
          path: |
            evidence/stage3e/
            reports/stage3e/
            data/stage3e/*/normalized/
          if-no-files-found: error
          retention-days: 30
