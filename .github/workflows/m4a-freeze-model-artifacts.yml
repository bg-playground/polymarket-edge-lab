name: Milestone 4A freeze Stage 3G model artifacts

on:
  push:
    branches:
      - agent/m4a-freeze-real-model-artifacts
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freeze-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Download preserved successful Stage 3G empirical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage3g
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/9248520442/zip \
            > /tmp/stage3g.zip
          unzip -q /tmp/stage3g.zip -d /tmp/stage3g
          test -f /tmp/stage3g/reports/stage3g/discovery/stage3g_pre_event_panel.parquet
          test -f /tmp/stage3g/evidence/stage3g/discovery_manifest.json
          test -f /tmp/stage3g/reports/stage3g/stage3g_pre_event_results.json

      - name: Assert preserved Stage 3G result passed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('/tmp/stage3g/reports/stage3g/stage3g_pre_event_results.json').read_text()
          )
          assert result['advancement_gate']['passed'] is True
          assert result['leakage_audit_passed'] is True
          assert result['discovery_window_count'] == 7
          print('validated preserved Stage 3G PASS artifact')
          PY

      - name: Export frozen Milestone 4A model artifacts
        run: |
          set -euo pipefail
          python scripts/export_stage3g_frozen_models.py \
            --discovery-panel /tmp/stage3g/reports/stage3g/discovery/stage3g_pre_event_panel.parquet \
            --output-dir frozen-models \
            --source-commit 253f0e36f519d9438f51a3e446b333d2bab8fc5f

      - name: Record immutable source provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          panel = Path('/tmp/stage3g/reports/stage3g/discovery/stage3g_pre_event_panel.parquet')
          discovery_manifest = Path('/tmp/stage3g/evidence/stage3g/discovery_manifest.json')
          result = Path('/tmp/stage3g/reports/stage3g/stage3g_pre_event_results.json')
          payload = {
              'schema_version': 'm4a-freeze-source-v1',
              'stage3g_workflow_run_id': 31890475572,
              'stage3g_artifact_id': 9248520442,
              'stage3g_artifact_api_digest': 'sha256:5400b32db51ee2ec323cc2e3722fd5a0f0c8ace4cb1215de75045cc71f8dd696',
              'stage3g_source_commit': '253f0e36f519d9438f51a3e446b333d2bab8fc5f',
              'discovery_panel_sha256': sha256(panel),
              'discovery_manifest_sha256': sha256(discovery_manifest),
              'stage3g_results_sha256': sha256(result),
          }
          Path('frozen-models/source_provenance.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify exported artifact manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('frozen-models/manifest.json').read_text())
          assert manifest['source_commit'] == '253f0e36f519d9438f51a3e446b333d2bab8fc5f'
          assert len(manifest['models']) == 4
          names = {model['model_name'] for model in manifest['models']}
          assert names == {
              'hgb_all_pre_event',
              'hgb_timing_inventory',
              'linear_timing_inventory',
              'hgb_timing_inventory_btc60',
          }
          for model in manifest['models']:
              assert len(model['regressor_sha256']) == 64
              assert len(model['classifier_sha256']) == 64
              assert len(model['preprocessing_fingerprint']) == 64
          print('validated frozen model manifest and fingerprints')
          PY

      - name: Write checksum inventory
        run: |
          find frozen-models -type f -print0 | sort -z | xargs -0 sha256sum > frozen-models/SHA256SUMS
          cat frozen-models/source_provenance.json
          cat frozen-models/manifest.json

      - name: Upload frozen model evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-4a-frozen-stage3g-models
          path: frozen-models/
          if-no-files-found: error
          retention-days: 90
