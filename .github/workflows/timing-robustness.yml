name: Empirical timing robustness — nagi777

on:
  push:
    branches:
      - empirical-timing-robustness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run deterministic tests
        run: pytest -q

      - name: Define frozen seven-day panel
        shell: bash
        run: |
          mkdir -p evidence reports/timing-robustness
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          windows = []
          for day in range(7, 14):
              start = int(datetime(2026, 8, day, 12, 0, tzinfo=timezone.utc).timestamp())
              windows.append({
                  "window_id": f"2026-08-{day:02d}T12-18Z",
                  "start_epoch": start,
                  "end_epoch": start + 21600,
                  "complete": True,
              })
          with open("evidence/window_manifest.json", "w", encoding="utf-8") as handle:
              json.dump({"windows": windows}, handle, indent=2)
          PY
          cat evidence/window_manifest.json

      - name: Collect and analyze independent windows
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=0xbf337426aa856996b8bb79b238345dd1a0276bf7
          python - <<'PY' > /tmp/windows.tsv
          import json
          data = json.load(open("evidence/window_manifest.json", encoding="utf-8"))
          for w in data["windows"]:
              print(w["window_id"], w["start_epoch"], w["end_epoch"], sep="\t")
          PY
          while IFS=$'\t' read -r WINDOW START END; do
            echo "=== $WINDOW [$START, $END) ==="
            mkdir -p "data/$WINDOW/raw" "data/$WINDOW/normalized" "reports/windows/$WINDOW"
            python scripts/collect_historical_trades.py \
              --account "$ACCOUNT" \
              --windowed \
              --global-start "$START" \
              --global-end "$END" \
              --window-seconds 3600 \
              --min-window-seconds 300 \
              --page-size 500 \
              --raw-dir "data/$WINDOW/raw" \
              --normalized-dir "data/$WINDOW/normalized" \
              --duckdb-path "data/$WINDOW/window.duckdb" \
              2>&1 | tee "evidence/$WINDOW-collection.log"
            python scripts/analyze_pair_sensitivity.py \
              --account "$ACCOUNT" \
              --duckdb-path "data/$WINDOW/window.duckdb" \
              --collection-start "$START" \
              --collection-end "$END" \
              --output-dir "reports/windows/$WINDOW" \
              2>&1 | tee "evidence/$WINDOW-analysis.log"
          done < /tmp/windows.tsv

      - name: Aggregate predeclared robustness hypotheses
        run: |
          python scripts/analyze_timing_robustness.py \
            --manifest evidence/window_manifest.json \
            --reports-root reports/windows \
            --output-dir reports/timing-robustness \
            | tee evidence/timing_robustness.log

      - name: Write scope note
        shell: bash
        run: |
          cat > evidence/TIMING_ROBUSTNESS_SCOPE.md <<'EOF'
          # Timing robustness run

          Frozen before collection:
          - seven non-overlapping UTC windows: 2026-08-07 through 2026-08-13, 12:00-18:00 UTC;
          - primary latency hypothesis: FIFO 61-120 second complementary-fill lag;
          - primary market-time hypothesis: FIFO market seconds 100-199;
          - adequate-window threshold: 500 paired shares in the target slice.

          Existing cohort, FIFO matching, latency buckets, and market-time bands are reused unchanged.
          Results are historical execution-price accounting only, not a predictive or trading claim.
          EOF

      - name: Upload robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: nagi777-timing-robustness
          path: |
            evidence/
            reports/
            data/*/raw/
            data/*/normalized/
          if-no-files-found: error
          retention-days: 30
