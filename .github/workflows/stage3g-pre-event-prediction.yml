name: Milestone 3G strict pre-event prediction

on:
  push:
    branches:
      - milestone-3g-pre-event-prediction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-event-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run deterministic tests
        run: pytest -q
      - name: Define frozen discovery and untouched external windows
        run: |
          mkdir -p evidence/stage3g data/stage3g/discovery data/stage3g/external reports/stage3g
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          def windows(month, days, label):
              result = []
              for day in days:
                  start = int(datetime(2026, month, day, 12, 0, tzinfo=timezone.utc).timestamp())
                  result.append({
                      "window_id": f"{label}-2026-{month:02d}-{day:02d}T12-18Z",
                      "start_epoch": start,
                      "end_epoch": start + 21600,
                  })
              return result

          discovery = {"windows": windows(8, range(7, 14), "discovery")}
          external = {"windows": windows(7, range(10, 17), "external")}
          for kind, manifest in (("discovery", discovery), ("external", external)):
              with open(f"evidence/stage3g/{kind}_manifest.json", "w", encoding="utf-8") as handle:
                  json.dump(manifest, handle, indent=2)
          PY
      - name: Collect independent BTC reference data
        shell: bash
        run: |
          set -euo pipefail
          for KIND in discovery external; do
            MANIFEST="evidence/stage3g/${KIND}_manifest.json"
            START=$(python -c "import json; print(json.load(open('$MANIFEST'))['windows'][0]['start_epoch'] - 300)")
            END=$(python -c "import json; print(json.load(open('$MANIFEST'))['windows'][-1]['end_epoch'])")
            python scripts/collect_btc_reference.py \
              --start "$START" --end "$END" \
              --raw "evidence/stage3g/${KIND}-coinbase-btc-usd-60s-raw.json" \
              --provenance "evidence/stage3g/${KIND}-coinbase-btc-usd-60s-provenance.json"
          done
      - name: Collect frozen Polymarket windows
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=0xbf337426aa856996b8bb79b238345dd1a0276bf7
          for KIND in discovery external; do
            MANIFEST="evidence/stage3g/${KIND}_manifest.json"
            python - "$MANIFEST" <<'PY' > /tmp/windows.tsv
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for window in data["windows"]:
              print(window["window_id"], window["start_epoch"], window["end_epoch"], sep="\t")
          PY
            while IFS=$'\t' read -r WINDOW START END; do
              ROOT="data/stage3g/$KIND/$WINDOW"
              mkdir -p "$ROOT/raw" "$ROOT/normalized"
              python scripts/collect_historical_trades.py \
                --account "$ACCOUNT" --windowed \
                --global-start "$START" --global-end "$END" \
                --window-seconds 3600 --min-window-seconds 300 --page-size 500 \
                --raw-dir "$ROOT/raw" --normalized-dir "$ROOT/normalized" \
                --duckdb-path "$ROOT/window.duckdb" \
                2>&1 | tee "evidence/stage3g/${WINDOW}-collection.log"
            done < /tmp/windows.tsv
          done
      - name: Materialize strict pre-event panels
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=0xbf337426aa856996b8bb79b238345dd1a0276bf7
          for KIND in discovery external; do
            python scripts/materialize_stage3g_pre_event.py \
              --account "$ACCOUNT" \
              --manifest "evidence/stage3g/${KIND}_manifest.json" \
              --data-root "data/stage3g/${KIND}" \
              --btc-raw "evidence/stage3g/${KIND}-coinbase-btc-usd-60s-raw.json" \
              --output-dir "reports/stage3g/${KIND}" \
              | tee "evidence/stage3g/${KIND}-materialization.log"
          done
      - name: Evaluate frozen Stage 3G models
        run: |
          python scripts/evaluate_stage3g_pre_event.py \
            --discovery-panel reports/stage3g/discovery/stage3g_pre_event_panel.parquet \
            --external-panel reports/stage3g/external/stage3g_pre_event_panel.parquet \
            --discovery-coverage reports/stage3g/discovery/stage3g_pre_event_coverage.json \
            --external-coverage reports/stage3g/external/stage3g_pre_event_coverage.json \
            --output-dir reports/stage3g \
            | tee evidence/stage3g/pre-event-evaluation.log
      - name: Assert frozen Stage 3G contract
        run: |
          python - <<'PY'
          import json
          result = json.load(open("reports/stage3g/stage3g_pre_event_results.json"))
          assert result["discovery_window_count"] == 7
          assert result["external_window_count"] == 7
          assert result["discovery_row_count"] > 0
          assert result["external_row_count"] > 0
          assert result["leakage_audit_passed"] is True
          assert len(result["external_folds"]["hgb_all_pre_event"]) == 7
          assert len(result["advancement_gate"]["checks"]) == 8
          print("validated frozen Stage 3G evaluation contract")
          PY
      - name: Upload Stage 3G evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-3g-pre-event-prediction
          path: |
            evidence/stage3g/
            reports/stage3g/
            data/stage3g/*/*/normalized/
          if-no-files-found: error
          retention-days: 30
