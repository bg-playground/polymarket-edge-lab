[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polymarket-edge-lab"
version = "0.1.0"
description = "Forensic research toolkit for Polymarket trade reconstruction and market microstructure analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_edge_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/analyze_pair_sensitivity.py" = ["E501"]
"scripts/analyze_timing_robustness.py" = ["E501"]
"src/polymarket_edge_lab/analysis/timing_robustness.py" = ["UP017"]
"tests/test_timing_robustness.py" = ["UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["polymarket_edge_lab"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet", "tenacity"]
ignore_missing_imports = true
